<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Resume</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet"
    />
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        /* Unified dark identity — derived from the game's 3D PALETTE so the static
           fallback and the interactive game read as one world. */
        :root {
            --bg-0: #05090f;
            --bg-1: #0a1320;
            --bg-2: #0f1d2e;
            --line: rgba(140, 220, 255, 0.16);
            --cyan: #8cdcff;
            --cyan-vivid: #00ccff;
            --gold: #ffd166;
            --mint: #7ef7c8;
            --tx-0: #e8f3ff;
            --tx-1: #bcd0e6;
            --tx-2: #7e94ad;
            --tx-3: #52677e;
            --f-display: "Space Grotesk", system-ui, sans-serif;
            --f-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
            --f-mono: "JetBrains Mono", "SF Mono", "Fira Code", monospace;
            --mw: 880px;
            --sg: 2.5rem;
        }

        html { font-size: 16px; }
        body {
            font-family: var(--f-body);
            background: var(--bg-0);
            color: var(--tx-1);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
            /* Cinematic dark stage: two soft accent glows + a faint board grid,
               matching the game overlay's background. */
            background-image:
                radial-gradient(900px 600px at 78% -8%, rgba(140, 220, 255, 0.1), transparent 60%),
                radial-gradient(800px 520px at 8% 12%, rgba(255, 209, 102, 0.05), transparent 55%),
                linear-gradient(rgba(140, 220, 255, 0.022) 1px, transparent 1px),
                linear-gradient(90deg, rgba(140, 220, 255, 0.022) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 44px 44px, 44px 44px;
            background-attachment: fixed;
        }
        a { color: var(--cyan); text-decoration: none; }

        .pg {
            max-width: var(--mw);
            margin: 0 auto;
            padding: clamp(2rem, 5vw, 3.5rem) clamp(1.1rem, 4vw, 2rem) 4rem;
        }

        .hd {
            display: flex;
            gap: 1.75rem;
            align-items: center;
            padding-bottom: 2rem;
            border-bottom: 1px solid var(--line);
        }
        .av {
            width: 144px;
            height: 144px;
            border-radius: 50%;
            flex: none;
            background: var(--bg-2);
            box-shadow: 0 0 38px -6px rgba(140, 220, 255, 0.5);
            touch-action: none;
        }
        .hd h1 {
            font-family: var(--f-display);
            font-size: clamp(1.5rem, 4vw, 1.95rem);
            font-weight: 700;
            letter-spacing: -0.02em;
            line-height: 1.1;
            color: var(--tx-0);
            text-shadow: 0 0 36px rgba(140, 220, 255, 0.25);
        }
        .hd .rl {
            color: var(--cyan);
            font-size: 1rem;
            font-weight: 600;
            margin-top: 0.25rem;
        }
        .ct {
            display: flex;
            flex-wrap: wrap;
            gap: 0.3rem 1.2rem;
            margin-top: 0.7rem;
            font-family: var(--f-mono);
            font-size: 0.78rem;
            color: var(--tx-2);
        }
        .ct a { color: var(--gold); }
        .ct .d { color: var(--tx-3); }
        .pl {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            margin-top: 0.6rem;
        }
        .pl a {
            padding: 0.2rem 0.6rem;
            font-family: var(--f-mono);
            font-size: 0.72rem;
            font-weight: 500;
            color: var(--mint);
            border: 1px solid rgba(126, 247, 200, 0.28);
            border-radius: 6px;
            text-decoration: none;
        }

        .sc { margin-top: var(--sg); }
        .st {
            font-family: var(--f-mono);
            font-size: 0.7rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.16em;
            color: var(--cyan);
            margin-bottom: 1rem;
        }

        .sm { font-size: 1rem; color: var(--tx-1); line-height: 1.7; }

        .en { margin-bottom: 1.75rem; }
        .en:last-child, .aw:last-child, .pj:last-child { margin-bottom: 0; }
        .et {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: baseline;
            gap: 0.5rem;
        }
        .er {
            font-family: var(--f-display);
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--tx-0);
        }
        .ed, .edy {
            font-size: 0.75rem;
            font-family: var(--f-mono);
            color: var(--tx-2);
        }
        .ed { white-space: nowrap; }
        .eo {
            font-size: 0.9rem;
            color: var(--cyan);
            font-weight: 600;
            margin-top: 0.1rem;
        }
        .es, .as {
            font-size: 0.875rem;
            color: var(--tx-1);
            margin-top: 0.4rem;
            line-height: 1.6;
        }
        .eh { margin-top: 0.55rem; list-style: none; display: grid; gap: 0.4rem; }
        .eh li {
            position: relative;
            padding-left: 1.1rem;
            font-size: 0.875rem;
            line-height: 1.55;
            color: var(--tx-1);
        }
        .eh li::before {
            content: "\25B8";
            position: absolute;
            left: 0;
            color: rgba(140, 220, 255, 0.6);
        }

        .sg {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1rem;
        }
        .sk {
            background: var(--bg-2);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 1rem 1.1rem;
        }
        .sn {
            font-family: var(--f-display);
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--tx-0);
            margin-bottom: 0.6rem;
        }
        .stg { display: flex; flex-wrap: wrap; gap: 0.35rem; }
        .stg span {
            padding: 0.18rem 0.5rem;
            font-family: var(--f-mono);
            font-size: 0.6875rem;
            background: rgba(140, 220, 255, 0.08);
            border: 1px solid rgba(140, 220, 255, 0.2);
            border-radius: 6px;
            color: var(--cyan);
        }

        .aw { margin-bottom: 1.2rem; }
        .edd, .at, .pn {
            font-family: var(--f-display);
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--tx-0);
        }
        .am { font-family: var(--f-mono); font-size: 0.7rem; color: var(--gold); margin-top: 0.15rem; }
        .edi { font-size: 0.875rem; color: var(--tx-1); margin-top: 0.15rem; }

        .pj { margin-bottom: 1.4rem; }

        .ft {
            margin-top: 3rem;
            padding-top: 1.2rem;
            border-top: 1px solid var(--line);
            text-align: center;
            font-family: var(--f-mono);
            font-size: 0.72rem;
            color: var(--tx-3);
            letter-spacing: 0.02em;
        }
        .ft a { color: var(--gold); }
        @keyframes roll { from { transform: rotate(0); } to { transform: rotate(360deg); } }
        .roll { animation: roll 1.5s ease-in-out; }

        @media (max-width: 640px) {
            .pg { padding: 1.5rem 1rem 2rem; }
            .hd {
                flex-direction: column;
                text-align: center;
                gap: 1rem;
            }
            .av { width: 110px; height: 110px; }
            .ct { justify-content: center; }
            .pl { justify-content: center; }
            .sg { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="pg">
        {% if avatar_mesh_b64 %}
        <canvas id="avatar" class="av" width="{{ avatar_render_px }}" height="{{ avatar_render_px }}"></canvas>
        {% endif %}
    </div>
    <script>
        (async function () {
            {# ── Shared decompress ── #}
            var D = "div", N = "\n", T = "\t", SP = "span";
            function dz(b) { var r = Uint8Array.from(atob(b), function (c) { return c.charCodeAt(0); }); var d = new DecompressionStream("deflate"); var w = d.writable.getWriter(); w.write(r); w.close(); return new Response(d.readable).arrayBuffer(); }

            {# ── Helpers ── #}
            function e(t, c, h) { var n = document.createElement(t); if (c) n.className = c; if (h) n.innerHTML = h; return n; }
            function sc(title) { var s = e("section", "sc"); s.append(e("h2", "st", title)); return s; }
            function hl(items) { var ul = e("ul", "eh"); items.forEach(t => { ul.append(e("li", "", t)); }); return ul; }

            {# ── Decompress resume data ── #}
            var t = new TextDecoder().decode(new Uint8Array(await dz("{{ resume_data_b64 }}")));
            var s = t.split(N + N), p = document.querySelector(".pg");

            {# ── Header ── #}
            var b = s[0].split(N), hd = e("header", "hd");
            var av = document.getElementById("avatar");
            if (av) hd.append(av);
            var di = e(D);
            di.append(e("h1", "", b[0]));
            if (b[1]) di.append(e(D, "rl", b[1]));
            var ct = e(D, "ct"); ct.innerHTML = b[3];
            di.append(ct);
            var pl = e(D, "pl"); pl.innerHTML = b[4].split('href="').join('href="//');

            di.append(pl);
            hd.append(di);
            p.append(hd);

            {# ── Summary ── #}
            if (b[2]) { var sm = sc("Summary"); sm.append(e("p", "sm", b[2])); p.append(sm); }

            {# ── Experience ── #}
            var wk = s[1].split("--" + N), sx = sc("Experience");
            wk.forEach(w => {
                w = w.trim(); if (!w) return;
                var l = w.split(N), f = l[0].split(T), n = e(D, "en");
                var et = e(D, "et");
                et.append(e(SP, "er", f[1]));
                et.append(e(SP, "ed", f[2]));
                n.append(et);
                n.append(e(D, "eo", f[3]));
                if (f[4]) n.append(e("p", "es", f[4]));
                if (l.length > 1) n.append(hl(l.slice(1)));
                sx.append(n);
            });
            p.append(sx);

            {# ── Skills ── #}
            var sk = s[2].split(N), s2 = sc("Skills"), sg = e(D, "sg");
            sk.forEach(r => {
                if (!r) return;
                var f = r.split(T), d = e(D, "sk");
                d.append(e(D, "sn", f[0]));
                var tg = e(D, "stg");
                for (var i = 1; i < f.length; i++) tg.append(e(SP, "", f[i]));
                d.append(tg); sg.append(d);
            });
            s2.append(sg); p.append(s2);

            {# ── Projects (skip if empty) ── #}
            if (s[3].trim()) {
                var pj = s[3].split("--" + N), s3 = sc("Open Source &amp; Projects");
                pj.forEach(v => {
                    v = v.trim(); if (!v) return;
                    var l = v.split(N), f = l[0].split(T), d = e(D, "pj");
                    d.append(e(D, "pn", f[1]));
                    if (f[2]) d.append(e("p", "es", f[2]));
                    if (l.length > 1) d.append(hl(l.slice(1)));
                    s3.append(d);
                });
                p.append(s3);
            }

            {# ── Awards & Recognition ── #}
            var aw = s[4].split(N), s4 = sc("Awards &amp; Recognition");
            aw.forEach(r => {
                if (!r) return;
                var f = r.split(T), d = e(D, "aw");
                d.append(e(D, "at", f[0]));
                if (f[1]) d.append(e(D, "am", f[1]));
                if (f[2]) d.append(e("p", "as", f[2]));
                s4.append(d);
            });
            p.append(s4);

            {# ── Education ── #}
            var ed = s[5].split(N), s5 = sc("Education");
            ed.forEach(r => {
                if (!r) return;
                var f = r.split(T), d = e(D, "en"), et = e(D, "et");
                et.append(e(SP, "edd", f[0]));
                et.append(e(SP, "edy", f[1]));
                d.append(et);
                d.append(e(D, "edi", f[2]));
                s5.append(d);
            });
            p.append(s5);

            var ft = e("footer", "ft", 'Prefer the interactive version? <a href="./">Play the r\u00e9sum\u00e9 game \u2192</a><br />This entire r\u00e9sum\u00e9 is a single HTML file under 8 KB \u2014 with an easter egg hidden inside.');
            p.append(ft);

            var kc = [38,38,40,40,37,39,37,39,66,65], ki = 0;
            document.addEventListener("keydown", ev => {
                ki = ev.keyCode === kc[ki] ? ki + 1 : 0;
                if (ki === kc.length) { ki = 0; document.body.classList.add("roll"); document.body.addEventListener("animationend", () => { document.body.classList.remove("roll"); }, { once: true }); }
            });

            document.title = b[0] + (b[1] ? " \u2014 " + b[1] : "");

            {# ── Avatar with 1-level tessellation ── #}
            {% if avatar_mesh_b64 %}
            if (av) {
                var buf = new Uint8Array(await dz("{{ avatar_mesh_b64 }}"));
                var dv = new DataView(buf.buffer, buf.byteOffset, buf.byteLength);
                var hr = buf[0] / 10, hrc = buf[1] / 10, ib = buf[2], ncells = dv.getUint16(3, true), o = 5;
                var nc = 1 << ib, mask = nc - 1;
                {# Opt 6: single flat palette array instead of separate pR/pG/pB #}
                var pal = [];
                for (var i = 0; i < nc * 3; i++) pal.push(buf[o++]);
                var idx = [], bb = 0, bn = 0;
                for (var i = 0; i < ncells; i++) { while (bn < ib) { bb = (bb << 8) | buf[o++]; bn += 8; } bn -= ib; idx.push((bb >> bn) & mask); }

                var S = 144, cr = 72;

                {# Opt 4: shared sqrt(3)/2 constant for hex geometry #}
                var H = Math.sqrt(3) / 2;
                function grd(r, m) {
                    var g = [], dx = 2 * H * r, dy = 1.5 * r;
                    for (var row = 0; row < S / dy + 2; row++)
                        for (var col = 0; col < S / dx + 2; col++) {
                            var cx = col * dx + (row % 2 ? dx / 2 : 0), cy = row * dy;
                            if (Math.sqrt((cx - cr) * (cx - cr) + (cy - cr) * (cy - cr)) + r * m <= cr) g.push([cx, cy]);
                        }
                    return g;
                }
                var fc = grd(hr, 0.8), cc = grd(hrc, 0.8);

                {# Opt 4: hardcoded hex vertex offsets using known cos/sin at 60deg increments #}
                function hvx(r) { return [[H * r, H * r, 0, -H * r, -H * r, 0], [-.5 * r, .5 * r, r, .5 * r, -.5 * r, -r]]; }
                var cv = hvx(hrc);

                {# Average fine cell colors for each coarse cell #}
                var ci = [], th = hrc * hrc;
                for (var i = 0; i < cc.length; i++) {
                    var sr = 0, sg = 0, sb = 0, cnt = 0;
                    for (var j = 0; j < fc.length; j++) {
                        var dx = cc[i][0] - fc[j][0], dy = cc[i][1] - fc[j][1];
                        if (dx * dx + dy * dy < th) {
                            var k = idx[j] * 3; sr += pal[k]; sg += pal[k + 1]; sb += pal[k + 2]; cnt++;
                        }
                    }
                    ci.push(cnt ? "rgb(" + (sr / cnt | 0) + "," + (sg / cnt | 0) + "," + (sb / cnt | 0) + ")" : null);
                }

                var cT = new Float32Array(cc.length), cH = new Float32Array(cc.length);
                var can = av, ctx = can.getContext("2d");
                {# Bitmap is rendered at SC× the logical 144 grid so the revealed
                   photo is crisp; all geometry below stays in 144-space. #}
                var SC = can.width / S;
                var mx = -999, my = -999, hov = false, af = null;

                {# Real photo — the pixel-accurate layer revealed as the hexes lift. #}
                var photo = new Image();
                photo.onload = draw;
                photo.src = "data:image/jpeg;base64,{{ avatar_photo_b64 }}";

                {# Palette ring (shift→disappear→arrow→explosive→player) painted ON
                   TOP of the photo's rim, tying the résumé to the 3D world. Falls
                   back to a flat cyan stroke where conic gradients are unsupported. #}
                var rs = "rgba(140, 220, 255, 0.75)";
                if (ctx.createConicGradient) {
                    var rg = ctx.createConicGradient(200 * Math.PI / 180, cr, cr);
                    ["#0891b2", "#16a34a", "#facc15", "#dc2626", "#00ccff", "#0891b2"].forEach((c, i) => rg.addColorStop(i / 5, c));
                    rs = rg;
                }

                function pos(ev) { var r = can.getBoundingClientRect(); mx = (ev.clientX - r.left) * S / r.width; my = (ev.clientY - r.top) * S / r.height; }
                can.onpointerenter = () => { hov = true; };
                can.onpointerleave = () => { hov = false; mx = my = -999; };
                can.onpointermove = ev => { pos(ev); if (!af) af = requestAnimationFrame(tick); };

                {# Opt 5: squared distance avoids Math.sqrt in hot loop #}
                function tick(ts) {
                    var now = ts / 1000, any = false;
                    for (var i = 0; i < cc.length; i++) {
                        var dx = cc[i][0] - mx, dy = cc[i][1] - my;
                        if (hov && dx * dx + dy * dy < 784) { cH[i] = now; cT[i] = 1; }
                        else if (cT[i] > 0) { if (now - cH[i] > 3) cT[i] = 0; any = true; }
                    }
                    draw();
                    af = any || hov ? requestAnimationFrame(tick) : null;
                }

                {# Opt 2: shared hex-drawing helper for both passes #}
                function dh(g, vt, cl, sk) {
                    for (var i = 0; i < g.length; i++) {
                        if (!cl[i] || (sk && sk[i])) continue;
                        ctx.beginPath();
                        for (var v = 0; v < 6; v++) { v ? ctx.lineTo(g[i][0] + vt[0][v], g[i][1] + vt[1][v]) : ctx.moveTo(g[i][0] + vt[0][v], g[i][1] + vt[1][v]); }
                        ctx.closePath();
                        ctx.fillStyle = cl[i];
                        ctx.fill();
                    }
                }

                function draw() {
                    ctx.save();
                    ctx.scale(SC, SC);
                    ctx.clearRect(0, 0, S, S);
                    ctx.beginPath();
                    ctx.arc(cr, cr, cr, 0, Math.PI * 2);
                    ctx.clip();
                    {# real photo underneath; the hex mosaic hides it until you hover #}
                    if (photo.complete && photo.naturalWidth) ctx.drawImage(photo, 0, 0, S, S);
                    dh(cc, cv, ci, cT);
                    {# ring sits on the photo's rim; clip keeps its outer edge crisp #}
                    ctx.lineWidth = 5;
                    ctx.strokeStyle = rs;
                    ctx.beginPath();
                    ctx.arc(cr, cr, cr - 2.5, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.restore();
                }

                draw();
            }
            {% endif %}
        })();
    </script>
</body>
</html>
