name: Deploy to GitHub Pages

# Builds both outputs and deploys them side by side:
#   - the Three.js game        → https://codetiger.github.io/resume/
#   - the static résumé (HTML)  → https://codetiger.github.io/resume/resume.html
#
# One-time setup: repo Settings → Pages → Source = "GitHub Actions".

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; cancel in-progress runs on a new push.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Static résumé first — build.py writes assets/resume.html, which the Vite
      # build then copies into dist/ along with the rest of assets/.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python3 build.py

      # Game build → dist/ (Vite also copies assets/* — models, avatar,
      # resume.json, resume.html — into dist/).
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
