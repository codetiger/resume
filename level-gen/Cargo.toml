[package]
name = "level-gen"
version = "0.1.0"
edition = "2021"
description = "Algorithmic level generator, solver and curator for the rolling-cube résumé game"

[lib]
name = "level_gen"
path = "src/lib.rs"

[[bin]]
name = "level-gen"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
rand = "0.8"
rand_chacha = "0.3"
rayon = "1"
ctrlc = "3"
rustc-hash = "2"
smallvec = "1"
mimalloc = { version = "0.1", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
