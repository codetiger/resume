# Tooling config for the repo's lone Python helper — level-gen/wire_ladder.py, a
# standalone script (ruff-linted in CI). There is no installable package here.

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["level-gen/target", "dist", "node_modules"]

[tool.ruff.lint]
# Pyflakes + pycodestyle errors, import sorting, pyupgrade, bugbear, simplify.
select = ["E", "F", "I", "UP", "B", "SIM"]
