<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Harishankar Narayanan — Résumé</title>
    <meta
      name="description"
      content="The static résumé of Harishankar Narayanan — the no-JS companion to the interactive résumé game."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Shared design system — TOKENS only (this page owns its components). Served at
         /design-system/ by the aggregator build in prod and the vite.config.ts
         middleware in dev; the fallbacks keep the identity if it's ever absent. -->
    <link rel="stylesheet" href="/design-system/tokens.css" />
    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      /* Re-skin onto the shared design system: each token aliases a DS token (defined
         by /design-system/tokens.css); the fallback keeps the navy/cyan identity if the
         DS isn't present. --mw/--sg are résumé-only layout. */
      :root {
        --bg-0: var(--color-bg, #05090f);
        --bg-2: var(--color-bg-elevated, #0f1d2e);
        --line: var(--color-border, rgba(140, 220, 255, 0.16));
        --cyan: var(--color-accent, #8cdcff);
        --gold: var(--color-accent-2, #ffd166);
        --mint: var(--color-accent-3, #7ef7c8);
        --tx-0: var(--color-fg, #e8f3ff);
        --tx-1: var(--color-fg-secondary, #bcd0e6);
        --tx-2: var(--color-muted, #7e94ad);
        --tx-3: var(--color-subtle, #52677e);
        --f-display: var(--font-display, 'Space Grotesk', system-ui, sans-serif);
        --f-body: var(--font-sans, 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif);
        --f-mono: var(--font-mono, 'JetBrains Mono', 'SF Mono', 'Fira Code', monospace);
        --mw: 880px;
        --sg: 2.5rem;
      }

      html {
        font-size: 16px;
      }
      body {
        font-family: var(--f-body);
        background: var(--bg-0);
        color: var(--tx-1);
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
        /* Cinematic dark stage: two soft accent glows + a faint board grid, matching
           the game overlay's background. */
        background-image:
          radial-gradient(900px 600px at 78% -8%, rgba(140, 220, 255, 0.1), transparent 60%),
          radial-gradient(800px 520px at 8% 12%, rgba(255, 209, 102, 0.05), transparent 55%),
          linear-gradient(rgba(140, 220, 255, 0.022) 1px, transparent 1px),
          linear-gradient(90deg, rgba(140, 220, 255, 0.022) 1px, transparent 1px);
        background-size:
          100% 100%,
          100% 100%,
          44px 44px,
          44px 44px;
        background-attachment: fixed;
      }
      a {
        color: var(--cyan);
        text-decoration: none;
      }

      .pg {
        max-width: var(--mw);
        margin: 0 auto;
        padding: clamp(2rem, 5vw, 3.5rem) clamp(1.1rem, 4vw, 2rem) 4rem;
      }

      .hd {
        display: flex;
        gap: 1.75rem;
        align-items: center;
        padding-bottom: 2rem;
        border-bottom: 1px solid var(--line);
      }
      .av {
        width: 144px;
        height: 144px;
        border-radius: 50%;
        flex: none;
        object-fit: cover;
        background: var(--bg-2);
        box-shadow: 0 0 38px -6px rgba(140, 220, 255, 0.5);
      }
      .hd h1 {
        font-family: var(--f-display);
        font-size: clamp(1.5rem, 4vw, 1.95rem);
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1.1;
        color: var(--tx-0);
        text-shadow: 0 0 36px rgba(140, 220, 255, 0.25);
      }
      .hd .rl {
        color: var(--cyan);
        font-size: 1rem;
        font-weight: 600;
        margin-top: 0.25rem;
      }
      .ct {
        display: flex;
        flex-wrap: wrap;
        gap: 0.3rem 1.2rem;
        margin-top: 0.7rem;
        font-family: var(--f-mono);
        font-size: 0.78rem;
        color: var(--tx-2);
      }
      .ct a {
        color: var(--gold);
      }
      .ct .d {
        color: var(--tx-3);
      }
      .pl {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
        margin-top: 0.6rem;
      }
      .pl a {
        padding: 0.2rem 0.6rem;
        font-family: var(--f-mono);
        font-size: 0.72rem;
        font-weight: 500;
        color: var(--mint);
        border: 1px solid rgba(126, 247, 200, 0.28);
        border-radius: 6px;
      }

      .sc {
        margin-top: var(--sg);
      }
      .st {
        font-family: var(--f-mono);
        font-size: 0.7rem;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.16em;
        color: var(--cyan);
        margin-bottom: 1rem;
      }

      .sm {
        font-size: 1rem;
        color: var(--tx-1);
        line-height: 1.7;
      }

      .en {
        margin-bottom: 1.75rem;
      }
      .en:last-child,
      .aw:last-child,
      .pj:last-child {
        margin-bottom: 0;
      }
      .et {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: baseline;
        gap: 0.5rem;
      }
      .er {
        font-family: var(--f-display);
        font-size: 1.05rem;
        font-weight: 600;
        color: var(--tx-0);
      }
      .ed,
      .edy {
        font-size: 0.75rem;
        font-family: var(--f-mono);
        color: var(--tx-2);
      }
      .ed {
        white-space: nowrap;
      }
      .eo {
        font-size: 0.9rem;
        color: var(--cyan);
        font-weight: 600;
        margin-top: 0.1rem;
      }
      .es,
      .as {
        font-size: 0.875rem;
        color: var(--tx-1);
        margin-top: 0.4rem;
        line-height: 1.6;
      }
      .eh {
        margin-top: 0.55rem;
        list-style: none;
        display: grid;
        gap: 0.4rem;
      }
      .eh li {
        position: relative;
        padding-left: 1.1rem;
        font-size: 0.875rem;
        line-height: 1.55;
        color: var(--tx-1);
      }
      .eh li::before {
        content: '\25B8';
        position: absolute;
        left: 0;
        color: rgba(140, 220, 255, 0.6);
      }

      .sg {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 1rem;
      }
      .sk {
        background: var(--bg-2);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 1rem 1.1rem;
      }
      .sn {
        font-family: var(--f-display);
        font-size: 0.95rem;
        font-weight: 600;
        color: var(--tx-0);
        margin-bottom: 0.6rem;
      }
      .stg {
        display: flex;
        flex-wrap: wrap;
        gap: 0.35rem;
      }
      .stg span {
        padding: 0.18rem 0.5rem;
        font-family: var(--f-mono);
        font-size: 0.6875rem;
        background: rgba(140, 220, 255, 0.08);
        border: 1px solid rgba(140, 220, 255, 0.2);
        border-radius: 6px;
        color: var(--cyan);
      }

      .aw {
        margin-bottom: 1.2rem;
      }
      .edd,
      .at,
      .pn {
        font-family: var(--f-display);
        font-size: 0.95rem;
        font-weight: 600;
        color: var(--tx-0);
      }
      .am {
        font-family: var(--f-mono);
        font-size: 0.7rem;
        color: var(--gold);
        margin-top: 0.15rem;
      }
      .edi {
        font-size: 0.875rem;
        color: var(--tx-1);
        margin-top: 0.15rem;
      }

      .pj {
        margin-bottom: 1.4rem;
      }

      .ft {
        margin-top: 3rem;
        padding-top: 1.2rem;
        border-top: 1px solid var(--line);
        text-align: center;
        font-family: var(--f-mono);
        font-size: 0.72rem;
        color: var(--tx-3);
        letter-spacing: 0.02em;
      }
      .ft a {
        color: var(--gold);
      }

      @keyframes roll {
        from {
          transform: rotate(0);
        }
        to {
          transform: rotate(360deg);
        }
      }
      .roll {
        animation: roll 1.5s ease-in-out;
      }

      @media (max-width: 640px) {
        .pg {
          padding: 1.5rem 1rem 2rem;
        }
        .hd {
          flex-direction: column;
          text-align: center;
          gap: 1rem;
        }
        .av {
          width: 110px;
          height: 110px;
        }
        .ct {
          justify-content: center;
        }
        .pl {
          justify-content: center;
        }
        .sg {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <!-- Content is rendered at build time from assets/resume.json by the `static-resume`
         Vite plugin (src/resume/render.ts) — ships as plain HTML, no client framework. -->
    <main class="pg">%RESUME%</main>

    <!-- Progressive-enhancement easter egg only (the page reads fine without it): the
         Konami code tips the cube, a nod to the game. -->
    <script>
      (() => {
        const code = [38, 38, 40, 40, 37, 39, 37, 39, 66, 65];
        let i = 0;
        addEventListener('keydown', (e) => {
          i = e.keyCode === code[i] ? i + 1 : 0;
          if (i === code.length) {
            i = 0;
            document.body.classList.add('roll');
            document.body.addEventListener(
              'animationend',
              () => document.body.classList.remove('roll'),
              {
                once: true,
              },
            );
          }
        });
      })();
    </script>
  </body>
</html>
